name: Deploy to Fly.io

# Run by hand from the Actions tab. It needs a FLY_API_TOKEN repository
# secret (`fly tokens create deploy`), and the app named in fly.toml to exist.
on:
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-arg APP_VERSION=${GITHUB_SHA::7}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
