# Local Postgres for working on the server, and optionally the whole app.
#
#   docker compose up -d db        the database only; run the server with npm
#   docker compose --profile app up --build
#                                  the database and the app on http://localhost:8080

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wonderbits
      POSTGRES_PASSWORD: wonderbits
      POSTGRES_DB: wonderbits
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
      # A second database that the server's tests may empty.
      - ./server/test-db.sql:/docker-entrypoint-initdb.d/test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonderbits"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wonderbits:wonderbits@db:5432/wonderbits
    ports:
      - "8080:8080"

volumes:
  db:
