# Wonderbits on Fly.io: one small machine running the Dockerfile, which holds
# both the built game and the server. The database is elsewhere (a free Neon
# Postgres) and is reached through the DATABASE_URL secret. See
# server/README.md for the steps.
#
# Change `app` and PUBLIC_URL to your own app's name before the first deploy.

app = "wonderbits"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_URL = "https://wonderbits.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is playing; wake on the next visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
